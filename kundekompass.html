<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kundekompass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220;
    --surface:#121A2E;
    --surface-2:#1B2540;
    --surface-3:#232F52;
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.16);
    --text:#EDEFF5;
    --text-muted:#8B93A7;
    --text-faint:#5B6480;
    --producer:#F2A93B;
    --motivator:#FF6B5B;
    --relator:#4FD1A5;
    --prosessor:#6C8CFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(108,140,255,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(79,209,165,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',system-ui,sans-serif;}

  .wrap{max-width:1180px;margin:0 auto;padding:36px 24px 80px;}

  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:8px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .brand-mark img{width:100%;height:100%;object-fit:contain;}
  .brand h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-0.01em;}
  .brand p{margin:2px 0 0;color:var(--text-muted);font-size:13px;}

  .tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin:28px 0 24px;width:fit-content;}
  .tab{padding:9px 18px;border-radius:9px;border:none;background:transparent;color:var(--text-muted);font-family:'Inter';font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s ease;}
  .tab:hover{color:var(--text);}
  .tab.active{background:var(--surface-3);color:var(--text);}

  .grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start;}
  @media (max-width:840px){.grid{grid-template-columns:1fr;}}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;}
  .panel-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);font-weight:600;margin:0 0 14px;}

  .qbank-item{border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:8px;background:var(--surface-2);}
  .qbank-item p{margin:0;font-size:13.5px;line-height:1.45;}
  .qbank-item-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .icon-btn{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:2px 4px;font-size:15px;line-height:1;flex-shrink:0;}
  .icon-btn:hover{color:#FF6B5B;}
  .use-btn{background:none;border:none;color:var(--prosessor);cursor:pointer;font-size:12px;font-weight:600;padding:0;margin-top:6px;}
  .use-btn:hover{text-decoration:underline;}

  .option-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .option-chip{background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s ease;font-family:'Inter';}
  .option-chip:hover{border-color:var(--prosessor);background:#1F2A4E;transform:translateY(-1px);}
  .option-chip.selected{border-color:var(--prosessor);background:#1F2A4E;box-shadow:0 0 0 3px rgba(108,140,255,0.35);font-weight:600;}
  .qbank-item.skipped{opacity:.55;}
  .skipped-tag{font-size:10.5px;color:var(--text-faint);font-style:italic;margin:6px 0 0;}
  .clear-answer-btn{background:none;border:none;color:var(--text-faint);font-size:11px;cursor:pointer;padding:0;margin-top:6px;}
  .clear-answer-btn:hover{color:#FF6B5B;}
  .option-chip-editable{display:flex;align-items:center;gap:6px;background:var(--surface-3);border:1px solid var(--border-strong);padding:5px 6px 5px 12px;border-radius:20px;font-size:12.5px;}
  .option-chip-editable button{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:12px;padding:0 2px;}
  .option-chip-editable button:hover{color:#FF6B5B;}
  .add-option-row{display:flex;gap:6px;margin-top:9px;}
  .add-option-row input{flex:1;padding:6px 10px;font-size:12.5px;}
  .add-option-row button{flex-shrink:0;}
  .no-options-note{font-size:11.5px;color:var(--text-faint);margin-top:8px;font-style:italic;}

  textarea, input[type=text]{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;
    color:var(--text);padding:10px 12px;font-family:'Inter';font-size:13.5px;resize:vertical;
  }
  textarea:focus, input[type=text]:focus{outline:none;border-color:var(--border-strong);}
  textarea::placeholder, input::placeholder{color:var(--text-faint);}

  .btn{background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);padding:9px 16px;border-radius:9px;font-family:'Inter';font-size:13px;font-weight:600;cursor:pointer;transition:all .15s ease;}
  .btn:hover{border-color:rgba(255,255,255,.3);}
  .btn-primary{background:linear-gradient(135deg, var(--prosessor), #4a63d1);border:none;color:white;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;filter:none;}
  .btn-full{width:100%;}
  .btn-sm{padding:6px 12px;font-size:12px;}

  .qa-log{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
  .qa-pair{border:1px solid var(--border);border-radius:11px;padding:13px 14px;background:var(--surface-2);}
  .qa-q{font-size:12px;color:var(--text-muted);margin:0 0 5px;font-weight:600;}
  .qa-a{font-size:14px;margin:0;line-height:1.5;}
  .qa-remove{float:right;}

  .add-qa-row{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}

  .empty-state{color:var(--text-faint);font-size:13px;text-align:center;padding:24px 10px;border:1px dashed var(--border-strong);border-radius:11px;}

  .name-row{display:flex;gap:10px;align-items:center;margin-bottom:18px;}
  .name-row input{max-width:280px;}

  /* Compass */
  .compass-wrap{margin-top:6px;}
  .compass{position:relative;aspect-ratio:1/1;max-width:420px;margin:0 auto;border-radius:16px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;}
  .compass-axis{position:absolute;background:var(--border);}
  .axis-v{left:50%;top:0;bottom:0;width:1px;}
  .axis-h{top:50%;left:0;right:0;height:1px;}
  .quad-label{position:absolute;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;border-radius:6px;}
  .axis-caption{position:absolute;font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;}
  .dot{position:absolute;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 5px currentColor, 0 0 22px 4px currentColor;opacity:.9;transition:all .5s cubic-bezier(.2,.9,.3,1.2);}
  .dot-core{position:absolute;inset:5px;border-radius:50%;background:var(--bg);}

  .score-bars{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
  .score-row{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:10px;}
  .score-name{font-size:12.5px;font-weight:600;}
  .score-track{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden;}
  .score-fill{height:100%;border-radius:5px;transition:width .6s ease;}
  .score-val{font-size:12px;color:var(--text-muted);text-align:right;}

  .result-header{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
  .result-badge{font-size:20px;font-weight:700;padding:6px 14px;border-radius:9px;}
  .signals{margin:16px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;}
  .signals li{font-size:13px;color:var(--text-muted);padding-left:16px;position:relative;line-height:1.5;}
  .signals li::before{content:"—";position:absolute;left:0;color:var(--text-faint);}
  .approach-box{margin-top:18px;padding:14px 16px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);}
  .approach-box p{margin:0;font-size:13.5px;line-height:1.6;}
  .pitfalls-box{margin-top:12px;padding:14px 16px;border-radius:11px;border:1px solid rgba(255,107,91,0.3);background:rgba(255,107,91,0.07);}
  .pitfalls-box p.label{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--motivator);}
  .pitfall-cards{display:flex;flex-direction:column;gap:8px;}
  .pitfall-card{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;}
  .pitfall-card-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .pitfall-title{margin:0;font-size:12.5px;font-weight:600;padding-left:16px;position:relative;}
  .pitfall-title::before{content:"⚠";position:absolute;left:0;color:var(--motivator);font-size:11px;}
  .pitfall-info-btn{background:none;border:1px solid var(--border-strong);color:var(--text-muted);cursor:pointer;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;flex-shrink:0;}
  .pitfall-info-btn:hover{border-color:var(--motivator);color:var(--text);}
  .pitfall-detail{margin:9px 0 0;font-size:12.5px;color:var(--text-muted);line-height:1.5;padding-left:16px;}
  .tips-toggle{background:none;border:none;color:var(--relator);cursor:pointer;font-size:12px;font-weight:600;padding:0;margin-top:12px;}
  .tips-toggle:hover{text-decoration:underline;}
  .tips-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .tips-list li{font-size:12.5px;color:var(--text-muted);padding-left:16px;position:relative;line-height:1.5;}
  .tips-list li::before{content:"✓";position:absolute;left:0;color:var(--relator);font-size:11px;}

  .history-card{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--surface);cursor:pointer;transition:border-color .15s;}
  .history-card:hover{border-color:var(--border-strong);}
  .history-top{display:flex;justify-content:space-between;align-items:center;}
  .history-name{font-weight:600;font-size:14px;}
  .history-date{font-size:11.5px;color:var(--text-faint);}
  .history-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em;}

  .loading-row{display:flex;align-items:center;gap:10px;color:var(--text-muted);font-size:13px;padding:14px 0;}
  .spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--border-strong);border-top-color:var(--prosessor);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .type-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .type-chip{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);}
  .type-dot{width:7px;height:7px;border-radius:50%;}
</style>
</head>

<script>
const CATEGORIES = ["Producer","Motivator","Relator","Prosessor"];
const COLORS = { Producer:"var(--producer)", Motivator:"var(--motivator)", Relator:"var(--relator)", Prosessor:"var(--prosessor)" };
const RAW_COLORS = { Producer:"#F2A93B", Motivator:"#FF6B5B", Relator:"#4FD1A5", Prosessor:"#6C8CFF" };
const DESCRIPTIONS = {
  Producer: "Resultatorientert og rask. Vil ha korte, konkrete svar og bestemmer selv, uten omveier.",
  Motivator: "Entusiastisk og sosial. Engasjeres av muligheter og historier, bestemmer på magefølelse.",
  Relator: "Relasjonsorientert og lojal. Trenger tillit og trygghet før beslutning, ofte i samråd med andre.",
  Prosessor: "Analytisk og detaljorientert. Vil ha fakta, sammenligning og tid til å tenke seg om."
};

const DEFAULT_BANK = [
  { question: "Snakker jeg med [navn]?", options: ["Ja (energisk)", "Ja (monoton)", "Ja (spørrende/usikker)", "Ja (forsiktig)", "Ja (streng)"] },
  { question: "Husker du dette? (snakke om tidligere bidrag)", options: ["Nei, ikke interessert", "Nei, avvisende og konkret", "Skeptisk", "Optimistisk", "Dele mer", "Medfølende"] },
  { question: "Går det fint med samtaleopptak?", options: [] },
  { question: "Som du sikkert forstår … (utdyper om en krise som trenger støtte)", options: [] },
  { question: "Kan du hjelpe oss med det?", options: [] }
];

// question text -> suggested options, used to offer a one-click fill-in when a saved
// question already exists but has no options attached yet
const SUGGESTED_OPTIONS = {};
DEFAULT_BANK.forEach(b => { if(b.options.length) SUGGESTED_OPTIONS[b.question] = b.options; });

// migrates an older plain-string question bank to the {question, options} shape
function normalizeBank(bank){
  if(!bank || !bank.length) return DEFAULT_BANK.map(b => ({...b, options:[...b.options]}));
  return bank.map(item => typeof item === 'string' ? { question: item, options: [] } : { question: item.question, options: item.options || [] });
}

let state = { questionBank: normalizeBank(null) };
let session = { qIndex: 0, bankAnswers: {}, result: null, analyzing: false };
let stateVersion = null;

const STORAGE_KEY = "salgsbot-data";

function getAllQa(){
  const bankPairs = Object.keys(session.bankAnswers)
    .map(Number)
    .sort((a,b) => a-b)
    .map(i => ({ question: state.questionBank[i].question, answer: session.bankAnswers[i] }));
  return bankPairs;
}

// one-off rewordings: replace an exact old option set with a corrected one,
// without touching questions the user has customized differently
const OPTION_RENAMES = [
  {
    question: "Snakker jeg med [navn]?",
    from: ["Ja", "Jaa (energisk)", "Kortfattet Ja (monoton)", "Spørrende/usikker JA", "Forsiktig Ja", "Streng Ja"],
    to: ["Ja (energisk)", "Ja (monoton)", "Ja (spørrende/usikker)", "Ja (forsiktig)", "Ja (streng)"]
  }
];
function arraysEqual(a,b){ return a.length === b.length && a.every((v,i) => v === b[i]); }

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.questionBank = normalizeBank(parsed.questionBank);
    }
  }catch(e){
    // no existing data yet — keep defaults
  }
  // auto-fill known suggestions for questions that already exist but still have no options
  let filled = false;
  state.questionBank.forEach(item => {
    if(item.options.length === 0 && SUGGESTED_OPTIONS[item.question]){
      item.options = [...SUGGESTED_OPTIONS[item.question]];
      filled = true;
    }
    const renameRule = OPTION_RENAMES.find(r => r.question === item.question && arraysEqual(item.options, r.from));
    if(renameRule){
      item.options = [...renameRule.to];
      filled = true;
    }
  });
  if(filled) saveState();
  render();
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error("Kunne ikke lagre:", e);
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function toggleTips(btn){
  const list = btn.nextElementSibling;
  const isHidden = !list.style.display || list.style.display === 'none';
  list.style.display = isHidden ? 'flex' : 'none';
  btn.textContent = isHidden ? '– Skjul tips til god pitch' : '+ Vis tips til god pitch';
}

function togglePitfallDetail(btn){
  const detail = btn.closest('.pitfall-card').querySelector('.pitfall-detail');
  const isHidden = !detail.style.display || detail.style.display === 'none';
  detail.style.display = isHidden ? 'block' : 'none';
  btn.textContent = isHidden ? 'Skjul' : 'Mer info';
}

// ---------- ANALYSE TAB ----------
function renderAnalyseTab(){
  const total = state.questionBank.length;
  const qi = session.qIndex;
  let bankOptions = '';

  if(total === 0){
    bankOptions = `<div class="empty-state">Ingen spørsmål i banken ennå.</div>`;
  } else {
    const lastVisible = Math.min(qi, total - 1);
    for(let i = 0; i <= lastVisible; i++){
      const item = state.questionBank[i];
      const isAnswered = session.bankAnswers.hasOwnProperty(i);
      const isSkipped = i < qi && !isAnswered;

      const chips = item.options.length
        ? `<div class="option-chips">${item.options.map((opt,oi) => {
            const sel = isAnswered && session.bankAnswers[i] === opt;
            return `<button class="option-chip${sel ? ' selected' : ''}" data-pick-answer="${i}:${oi}">${escapeHtml(opt)}</button>`;
          }).join('')}</div>`
        : `<p class="no-options-note">Ingen svaralternativer lagt til for dette spørsmålet ennå.</p>`;

      const skipTag = isSkipped ? `<p class="skipped-tag">Hoppet over</p>` : '';
      const navRow = (i === qi && !isAnswered) ? `
        <div style="display:flex; gap:14px; margin-top:10px;">
          ${qi > 0 ? `<button class="use-btn" data-back-question="${i}">← Forrige spørsmål</button>` : ''}
          <button class="use-btn" data-skip-question="${i}">→ Hopp over dette spørsmålet</button>
        </div>` : '';

      bankOptions += `
        <div class="qbank-item${isSkipped ? ' skipped' : ''}" data-bank-idx="${i}">
           <p style="color:var(--text-faint); font-size:10.5px; margin:0 0 6px;">Spørsmål ${i+1} av ${total}</p>
           <p>${escapeHtml(item.question)}</p>
           ${chips}
           ${skipTag}
           ${navRow}
        </div>`;
    }
    if(qi >= total){
      bankOptions += `<div class="empty-state" style="margin-top:6px;">
        Alle spørsmål i banken er gjennomgått.<br>
        <button class="use-btn" id="back-from-end-btn" style="margin-top:8px;">← Tilbake til siste spørsmål</button>
        &nbsp;·&nbsp;
        <button class="use-btn" id="restart-questions-btn">↺ Start på nytt fra spørsmål 1</button>
      </div>`;
    }
  }

  const allQa = getAllQa();
  const resultHtml = session.result ? renderResult(session.result) : '';
  const loadingHtml = session.analyzing ? `<div class="loading-row"><div class="spinner"></div> Analyserer svarene …</div>` : '';

  document.getElementById('content').innerHTML = `
    <div class="panel" style="max-width:620px;">
      <p class="panel-title">Svar fra kunde</p>
      <div id="bank-list">${bankOptions}</div>

      <div style="display:flex; gap:10px; margin-top:18px;">
        <button class="btn btn-primary" id="analyze-btn" ${allQa.length === 0 || session.analyzing ? 'disabled' : ''}>Analyser kunde</button>
        <button class="btn" id="clear-session-btn">Tøm samtale</button>
      </div>

        ${loadingHtml}
        ${resultHtml}
    </div>
  `;

  attachAnalyseListeners();
}

function renderResult(result){
  const scores = result.scores;
  const max = Math.max(...Object.values(scores)) || 1;
  // compass position: x = people-focus - task-focus, y = fast-pace - slow-pace
  const people = (scores.Motivator + scores.Relator);
  const task = (scores.Producer + scores.Prosessor);
  const fast = (scores.Producer + scores.Motivator);
  const slow = (scores.Relator + scores.Prosessor);
  const xPct = 50 + ((people - task) / 2); // roughly centers around 50
  const yPct = 50 - ((fast - slow) / 2);
  const clamp = v => Math.min(88, Math.max(12, v));

  const barsHtml = CATEGORIES.map(cat => `
    <div class="score-row">
      <span class="score-name" style="color:${COLORS[cat]}">${cat}</span>
      <div class="score-track"><div class="score-fill" style="width:${scores[cat]}%; background:${COLORS[cat]};"></div></div>
      <span class="score-val mono">${scores[cat]}</span>
    </div>
  `).join('');

  const signalsHtml = (result.signals || []).map(s => `<li>${escapeHtml(s)}</li>`).join('');

  return `
    <div style="margin-top:22px; padding-top:20px; border-top:1px solid var(--border);">
      <div class="result-header">
        <span class="result-badge" style="background:${COLORS[result.primary]}22; color:${COLORS[result.primary]}; border:1px solid ${COLORS[result.primary]}55;">${result.primary}</span>
      </div>

      <div class="grid" style="grid-template-columns: 1fr 1fr; gap:24px; margin-top:16px;">
        <div class="compass-wrap">
          <div class="compass">
            <div class="compass-axis axis-v"></div>
            <div class="compass-axis axis-h"></div>
            <div class="quad-label" style="top:10px; left:10px; color:${RAW_COLORS.Producer};">Producer</div>
            <div class="quad-label" style="top:10px; right:10px; color:${RAW_COLORS.Motivator};">Motivator</div>
            <div class="quad-label" style="bottom:10px; left:10px; color:${RAW_COLORS.Prosessor};">Prosessor</div>
            <div class="quad-label" style="bottom:10px; right:10px; color:${RAW_COLORS.Relator};">Relator</div>
            <div class="axis-caption" style="top:2px; left:50%; transform:translateX(-50%);">Raskt</div>
            <div class="axis-caption" style="bottom:2px; left:50%; transform:translateX(-50%);">Rolig</div>
            <div class="axis-caption" style="left:4px; top:50%; transform:translateY(-50%) rotate(-90deg); transform-origin:left center;">Oppgave</div>
            <div class="axis-caption" style="right:4px; top:50%; transform:translateY(-50%) rotate(90deg); transform-origin:right center;">Menneske</div>
            <div class="dot" style="left:${clamp(xPct)}%; top:${clamp(yPct)}%; color:${RAW_COLORS[result.primary]};"><div class="dot-core"></div></div>
          </div>
        </div>
        <div class="score-bars">${barsHtml}</div>
      </div>

      <ul class="signals">${signalsHtml}</ul>

      <div class="approach-box">
        <p><strong style="color:${COLORS[result.primary]}">Pitch:</strong><br>${escapeHtml(result.pitch)}</p>
        <button class="tips-toggle" onclick="toggleTips(this)">+ Vis tips til god pitch</button>
        <ul class="tips-list" style="display:none;">${(result.tips || []).map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>
      </div>

      <div class="approach-box">
        <p><strong style="color:${COLORS[result.primary]}">Innvendingshåndtering:</strong><br>${escapeHtml(result.objectionHandling)}</p>
        <button class="tips-toggle" onclick="toggleTips(this)">+ Vis tips til innvendingshåndtering</button>
        <ul class="tips-list" style="display:none;">${(result.objectionTips || []).map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>
      </div>

      <div class="approach-box">
        <p><strong style="color:${COLORS[result.primary]}">Closing:</strong><br>${escapeHtml(result.closing)}</p>
        <button class="tips-toggle" onclick="toggleTips(this)">+ Vis tips til closing</button>
        <ul class="tips-list" style="display:none;">${(result.closingTips || []).map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>
      </div>

      <div class="pitfalls-box">
        <p class="label">Viktigste fallgruver</p>
        <div class="pitfall-cards">
          ${(result.pitfalls || []).slice(0,3).map(p => `
            <div class="pitfall-card">
              <div class="pitfall-card-row">
                <p class="pitfall-title">${escapeHtml(p.title)}</p>
                <button class="pitfall-info-btn" onclick="togglePitfallDetail(this)">Mer info</button>
              </div>
              <p class="pitfall-detail" style="display:none;">${escapeHtml(p.detail)}</p>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function attachAnalyseListeners(){
  document.querySelectorAll('[data-pick-answer]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [qi, oi] = btn.dataset.pickAnswer.split(':').map(Number);
      const item = state.questionBank[qi];
      const clickedOption = item.options[oi];

      if(session.bankAnswers[qi] === clickedOption){
        // clicking the already-selected answer again: un-answer this question
        // and collapse any later questions that were revealed because of it
        delete session.bankAnswers[qi];
        session.qIndex = qi;
      } else {
        session.bankAnswers[qi] = clickedOption;
        if(session.qIndex <= qi) session.qIndex = qi + 1;
      }
      session.result = null;
      renderAnalyseTab();
    });
  });

  document.querySelectorAll('[data-skip-question]').forEach(btn => {
    btn.addEventListener('click', () => {
      const qi = parseInt(btn.dataset.skipQuestion);
      delete session.bankAnswers[qi];
      session.qIndex = qi + 1;
      renderAnalyseTab();
    });
  });

  document.querySelectorAll('[data-back-question]').forEach(btn => {
    btn.addEventListener('click', () => {
      const qi = parseInt(btn.dataset.backQuestion);
      if(qi > 0) session.qIndex = qi - 1;
      renderAnalyseTab();
    });
  });

  const backFromEndBtn = document.getElementById('back-from-end-btn');
  if(backFromEndBtn) backFromEndBtn.addEventListener('click', () => {
    session.qIndex = Math.max(0, state.questionBank.length - 1);
    renderAnalyseTab();
  });

  const restartBtn = document.getElementById('restart-questions-btn');
  if(restartBtn) restartBtn.addEventListener('click', () => {
    session.qIndex = 0;
    session.bankAnswers = {};
    session.result = null;
    renderAnalyseTab();
  });

  document.getElementById('clear-session-btn').addEventListener('click', () => {
    session = { qIndex: 0, bankAnswers: {}, result: null, analyzing: false };
    renderAnalyseTab();
  });

  const analyzeBtn = document.getElementById('analyze-btn');
  if(analyzeBtn) analyzeBtn.addEventListener('click', runAnalysis);
}

async function runAnalysis(){
  const apiKey = localStorage.getItem(API_KEY_STORAGE);
  if(!apiKey){
    alert("Legg inn en Anthropic API-nøkkel øverst på siden først.");
    return;
  }

  session.analyzing = true;
  session.result = null;
  renderAnalyseTab();

  const allQa = getAllQa();
  const transcript = allQa.map((p,i) => `${i+1}. Spørsmål: ${p.question}\n   Svar: ${p.answer}`).join('\n\n');

  const systemPrompt = `Du er en salgscoach som klassifiserer kunder i én av fire kundetyper basert på en telefon-/dørsalgssamtale hvor man verver faddere/givere for Plan Norge (barnefadderskap). Kategoriene:

- Producer: resultatorientert, rask, direkte, bestemmer selv, liker korte konkrete svar, utålmodig med detaljer.
- Motivator: entusiastisk, sosial, visjonær, engasjeres av muligheter og historier, bestemmer på magefølelse, liker å prate.
- Relator: relasjonsorientert, omsorgsfull, lojal, trenger tillit og trygghet, bryr seg om andre i husstanden, bestemmer sakte og i samråd.
- Prosessor: analytisk, detaljorientert, forsiktig, vil ha fakta og sammenligning, stiller motspørsmål, bestemmer sakte og metodisk.

Analyser spørsmål/svar-parene under og svar KUN med gyldig JSON på dette formatet, ingen annen tekst:
{"primary":"Producer|Motivator|Relator|Prosessor","scores":{"Producer":0-100,"Motivator":0-100,"Relator":0-100,"Prosessor":0-100},"signals":["kort observasjon 1","kort observasjon 2","kort observasjon 3"],"pitch":"1 kort setning (maks ca 20 ord) om hvordan selgeren bør pitche fadderskap til akkurat denne kundetypen","tips":["konkret tips 1 til en god pitch for denne kundetypen","konkret tips 2","konkret tips 3"],"objectionHandling":"1 kort setning (maks ca 20 ord) om hvordan selgeren bør møte innvendinger fra akkurat denne kundetypen","objectionTips":["konkret tips 1 til innvendingshåndtering for denne kundetypen","konkret tips 2","konkret tips 3"],"closing":"1 kort setning (maks ca 20 ord) om hvordan selgeren bør avslutte/closee akkurat denne kundetypen","closingTips":["konkret tips 1 til closing for denne kundetypen","konkret tips 2","konkret tips 3"],"pitfalls":[{"title":"kort tittel (maks 5-6 ord) som oppsummerer fallgruven","detail":"1-2 setninger med konkret forklaring av fallgruven og hvordan unngå den"}]}

Scores skal summere til omtrent 100. Signals skal referere konkret til noe kunden faktisk sa. Ha nøyaktig 3 pitfalls-objekter, hver med en kort tittel og en utdypende detail-setning, tilpasset denne kundetypen (ikke generiske). Alle tips-lister (tips, objectionTips, closingTips) skal være korte, konkrete, positive råd (hva selgeren bør gjøre) for denne kundetypen. Svar på norsk.`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: "user", content: `Samtale:\n\n${transcript}` }]
      })
    });
    if(!response.ok){
      const errText = await response.text();
      throw new Error(`API-feil (${response.status}): ${errText.slice(0,200)}`);
    }
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === "text");
    if(!textBlock) throw new Error("Ingen tekst i svaret");
    const clean = textBlock.text.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(clean);

    session.result = parsed;
    session.analyzing = false;
    renderAnalyseTab();
  }catch(e){
    console.error(e);
    session.analyzing = false;
    session.result = { primary:"Prosessor", scores:{Producer:0,Motivator:0,Relator:0,Prosessor:0}, signals:[`Analysen feilet: ${e.message}`], pitch:"Kunne ikke fullføre analysen akkurat nå.", tips:[], objectionHandling:"Kunne ikke fullføre analysen akkurat nå.", objectionTips:[], closing:"Kunne ikke fullføre analysen akkurat nå.", closingTips:[], pitfalls:[] };
    renderAnalyseTab();
  }
}

function render(){
  renderAnalyseTab();
}

loadState();
</script>
